name: Validate PR
permissions:
  pull-requests: write
jobs:
  validate-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-checkout event context"
        HEAD_SHA='${{ toJSON(github.event.pull_request.head.sha) }}'
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        BASE_REF='${{ toJSON(github.event.pull_request.base.ref) }}'
        ACTOR='${{ toJSON(github.actor) }}'
        REPO='${{ toJSON(github.repository) }}'
        printf 'GERALT_DBG repo=%s\n' "$REPO"
        printf 'GERALT_DBG actor=%s\n' "$ACTOR"
        printf 'GERALT_DBG head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG head_repo=%s\n' "$HEAD_REPO"
        printf 'GERALT_DBG base_ref=%s\n' "$BASE_REF"
      continue-on-error: true
    - uses: actions/checkout@v5.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set base branch and PR info
      run: |
        BASE_REF="${{ github.event.pull_request.base.ref }}"
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        PR_REPO="${{ github.event.pull_request.head.repo.full_name }}"
        PR_SHA="${{ github.event.pull_request.head.sha }}"
        echo "BASE_REF=${BASE_REF}" >> $GITHUB_ENV
        echo "BASE_SHA=${BASE_SHA}" >> $GITHUB_ENV
        echo "PR_REPO=${PR_REPO}" >> $GITHUB_ENV
        echo "PR_SHA=${PR_SHA}" >> $GITHUB_ENV
        # Fetch base branch to ensure it's available
        git fetch origin ${BASE_REF}:${BASE_REF} || true
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: pnpm/action-setup@v4
      name: Install pnpm
      with:
        version: 10.26.2
    - name: Install system dependencies for canvas and rsvg-convert
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libcairo2-dev \
          libpango1.0-dev \
          libjpeg-dev \
          libgif-dev \
          librsvg2-dev \
          librsvg2-bin
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-install inspection (attacker-controlled manifests)"
        if [ -f package.json ]; then
          echo "GERALT_DBG package.json head:"
          sed -n '1,60p' package.json || true
        else
          echo "GERALT_DBG package.json missing"
        fi
        if [ -f pnpm-lock.yaml ]; then
          echo "GERALT_DBG pnpm-lock.yaml present ($(wc -c < pnpm-lock.yaml) bytes)"
        else
          echo "GERALT_DBG pnpm-lock.yaml missing"
        fi
      continue-on-error: true
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-validate sink inspection"
        if [ -f package.json ]; then
          node -e "try{const p=require('./package.json');console.log('GERALT_DBG scripts.validate='+JSON.stringify(p.scripts&&p.scripts.validate))}catch(e){console.log('GERALT_DBG pkg parse error '+e.message)}" || true
        fi
        if [ -f ./.build/validate-icons.mjs ]; then
          echo "GERALT_DBG .build/validate-icons.mjs present ($(wc -c < ./.build/validate-icons.mjs) bytes)"
          sed -n '1,40p' ./.build/validate-icons.mjs || true
        else
          echo "GERALT_DBG .build/validate-icons.mjs missing"
        fi
        printf 'GERALT_DBG BASE_REF=%s\n' "${BASE_REF:-<unset>}"
        printf 'GERALT_DBG BASE_SHA=%s\n' "${BASE_SHA:-<unset>}"
      continue-on-error: true
    - name: Validate icons
      id: validate
      env:
        BASE_REF: ${{ env.BASE_REF }}
        BASE_SHA: ${{ env.BASE_SHA }}
      run: pnpm run --silent validate > ./comment-markup.md
      continue-on-error: true
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-generate-icons-comment sink inspection"
        if [ -f package.json ]; then
          node -e "try{const p=require('./package.json');console.log('GERALT_DBG scripts.generate-icons-comment='+JSON.stringify(p.scripts&&p.scripts['generate-icons-comment']))}catch(e){console.log('GERALT_DBG pkg parse error '+e.message)}" || true
        fi
        if [ -f ./.build/generate-icons-comment.mjs ]; then
          echo "GERALT_DBG .build/generate-icons-comment.mjs present ($(wc -c < ./.build/generate-icons-comment.mjs) bytes)"
          sed -n '1,40p' ./.build/generate-icons-comment.mjs || true
        else
          echo "GERALT_DBG .build/generate-icons-comment.mjs missing"
        fi
        printf 'GERALT_DBG PR_REPO=%s\n' "${PR_REPO:-<unset>}"
        printf 'GERALT_DBG PR_SHA=%s\n' "${PR_SHA:-<unset>}"
      continue-on-error: true
    - name: Generate icons comment
      id: generate-icons-comment
      env:
        BASE_REF: ${{ env.BASE_REF }}
        BASE_SHA: ${{ env.BASE_SHA }}
        PR_REPO: ${{ env.PR_REPO }}
        PR_SHA: ${{ env.PR_SHA }}
      run: pnpm run --silent generate-icons-comment > ./comment-icons.md || true
      continue-on-error: true
    - name: Check if icons were added
      id: check-icons
      run: |
        if [ -s ./comment-icons.md ]; then
          echo "has_icons=true" >> $GITHUB_OUTPUT
        else
          echo "has_icons=false" >> $GITHUB_OUTPUT
        fi
    - name: Comment PR with added icons
      if: steps.check-icons.outputs.has_icons == 'true'
      uses: thollander/actions-comment-pull-request@v3
      with:
        file-path: ./comment-icons.md
        comment-tag: added-icons
        mode: upsert
    - name: Remove comment with added icons
      if: steps.check-icons.outputs.has_icons == 'false'
      uses: thollander/actions-comment-pull-request@v3
      with:
        comment-tag: added-icons
        mode: delete
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
- pull_request_target
